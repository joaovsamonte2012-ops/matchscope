name: Gerar APK MatchScore Beta 24

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-apk-v24.yml'
      - '.github/assets/v24-bundle.zip'
      - '.github/workflows/matchscope_github_apk_ready_v3.zip'
      - '.github/assets/v23-texts.zip'
      - '.github/assets/rpg-v23-sprite.jpg'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      MATCHSCORE_KEYSTORE_B64: ${{ secrets.MATCHSCORE_KEYSTORE_B64 }}
      MATCHSCORE_KEYSTORE_PASSWORD: ${{ secrets.MATCHSCORE_KEYSTORE_PASSWORD }}
      MATCHSCORE_KEY_ALIAS: ${{ secrets.MATCHSCORE_KEY_ALIAS }}
      MATCHSCORE_KEY_PASSWORD: ${{ secrets.MATCHSCORE_KEY_PASSWORD }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar bundle V23
        run: |
          rm -rf "$GITHUB_WORKSPACE/.v23"
          mkdir -p "$GITHUB_WORKSPACE/.v23"
          unzip -q "$GITHUB_WORKSPACE/.github/assets/v23-texts.zip" -d "$GITHUB_WORKSPACE/.v23"
          test -f "$GITHUB_WORKSPACE/.v23/patch_beta_rpg_v23.py"
          test -f "$GITHUB_WORKSPACE/.v23/beta-rpg-v23.js"
          test -f "$GITHUB_WORKSPACE/.v23/beta-rpg-v23.css"

      - name: Preparar bundle V24
        run: |
          rm -rf "$GITHUB_WORKSPACE/.v24"
          mkdir -p "$GITHUB_WORKSPACE/.v24"
          unzip -q "$GITHUB_WORKSPACE/.github/assets/v24-bundle.zip" -d "$GITHUB_WORKSPACE/.v24"
          test -f "$GITHUB_WORKSPACE/.v24/patch_beta_v24.py"
          test -f "$GITHUB_WORKSPACE/.v24/beta-v24.js"
          test -f "$GITHUB_WORKSPACE/.v24/beta-v24.css"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extrair projeto base V3
        run: |
          mkdir -p "$GITHUB_WORKSPACE/projeto"
          unzip -q "$GITHUB_WORKSPACE/.github/workflows/matchscope_github_apk_ready_v3.zip" -d "$GITHUB_WORKSPACE/projeto"

      - name: Encontrar projeto Android
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/projeto" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS_FILE" || exit 1
          echo "ANDROID_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Validar chaves e certificado
        run: |
          test -n "$API_FOOTBALL_KEY"
          test -n "$MATCHSCORE_KEYSTORE_B64"
          test -n "$MATCHSCORE_KEYSTORE_PASSWORD"
          test -n "$MATCHSCORE_KEY_ALIAS"
          test -n "$MATCHSCORE_KEY_PASSWORD"
          echo "$MATCHSCORE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchscore-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/matchscore-release.jks" -alias "$MATCHSCORE_KEY_ALIAS" -storepass "$MATCHSCORE_KEYSTORE_PASSWORD" >/dev/null

      - name: Testar API-Football
        run: |
          curl --silent --show-error --fail -H "x-apisports-key: $API_FOOTBALL_KEY" "https://v3.football.api-sports.io/status" -o "$RUNNER_TEMP/api.json"
          python3 - <<'PYAPI'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'api.json'),encoding='utf-8'))
          if d.get('errors') or not d.get('response'): raise SystemExit('API-Football invalida')
          print('API-Football OK')
          PYAPI

      - name: Integrar API-Football
        run: python3 .github/scripts/patch_v4.py
      - name: Preparar escalacoes
        run: python3 .github/scripts/prepare_lineup_patch_v6.py
      - name: Aplicar campinho tatico
        run: python3 .github/scripts/patch_lineup_pitch.py
      - name: Aplicar identidade Beta
        run: python3 .github/scripts/patch_beta_branding.py
      - name: Aplicar social
        run: python3 .github/scripts/patch_beta_social.py
      - name: Aplicar progressao
        run: python3 .github/scripts/patch_beta_progression.py
      - name: Aplicar conta e login
        run: python3 .github/scripts/patch_beta_auth_payments.py
      - name: Aplicar login Google nativo
        run: python3 .github/scripts/patch_native_google_auth.py
      - name: Conectar login Google
        run: python3 .github/scripts/patch_native_google_auth_js.py
      - name: Aplicar menu responsivo
        run: python3 .github/scripts/patch_beta_profile_menu.py
      - name: Aplicar personagem legado
        run: python3 .github/scripts/patch_beta_character_gender.py
      - name: Aplicar cosmeticos
        run: python3 .github/scripts/patch_beta_cosmetics.py
      - name: Aplicar RPG legado
        run: python3 .github/scripts/patch_beta_rpg_daily.py
      - name: Aplicar correcoes nativas
        run: python3 .github/scripts/patch_beta_hotfix.py
      - name: Aplicar RPG V23 base
        run: V23_BUNDLE_DIR="$GITHUB_WORKSPACE/.v23" python3 "$GITHUB_WORKSPACE/.v23/patch_beta_rpg_v23.py"
      - name: Aplicar Beta 24 final
        run: V24_BUNDLE_DIR="$GITHUB_WORKSPACE/.v24" python3 "$GITHUB_WORKSPACE/.v24/patch_beta_v24.py"

      - name: Gerar APK Beta 24
        run: cd "$ANDROID_DIR" && gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validar APK Beta 24
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          test -n "$APK_FILE" || exit 1
          unzip -p "$APK_FILE" assets/www/index.html | grep -q 'beta-v24.js?v=24'
          unzip -p "$APK_FILE" assets/www/beta-v24.js | grep -q 'animatedCharacter'
          unzip -p "$APK_FILE" assets/www/beta-v24.js | grep -q 'data-v24-predict'
          unzip -p "$APK_FILE" assets/www/beta-v24.js | grep -q 'window.MatchScoreBack'
          unzip -p "$APK_FILE" assets/www/beta-v24.css | grep -q 'match-row.show-fav'
          unzip -p "$APK_FILE" assets/www/beta-rpg-v23.js | grep -q 'MatchScoreRPGBridge'
          if unzip -p "$APK_FILE" assets/www/beta-rpg-v23.js | grep -q 'player_legendary.jpg'; then
            echo 'ERRO: personagem PNG ainda esta referenciado'
            exit 1
          fi
          echo 'APK Beta 24 validado.'

      - name: Assinar APK MatchScore Beta 24
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/matchscore-release.jks" \
            --ks-key-alias "$MATCHSCORE_KEY_ALIAS" \
            --ks-pass "pass:$MATCHSCORE_KEYSTORE_PASSWORD" \
            --key-pass "pass:$MATCHSCORE_KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/resultado/MatchScore-Beta24.apk" "$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/resultado/MatchScore-Beta24.apk"

      - name: Disponibilizar APK Beta 24
        uses: actions/upload-artifact@v4
        with:
          name: MatchScore-APK-Beta24
          path: resultado/MatchScore-Beta24.apk
          if-no-files-found: error
          retention-days: 30

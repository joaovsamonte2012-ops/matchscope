name: Gerar APK MatchScope V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk-v4.yml'
      - '.github/workflows/matchscope_github_apk_ready_v3.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extrair projeto base V3
        run: |
          mkdir -p "$GITHUB_WORKSPACE/projeto"
          ZIP_FILE="$GITHUB_WORKSPACE/.github/workflows/matchscope_github_apk_ready_v3.zip"
          test -f "$ZIP_FILE" || { echo "ERRO: ZIP base V3 nao encontrado."; exit 1; }
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/projeto"

      - name: Encontrar projeto Android
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/projeto" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS_FILE" || { echo "ERRO: projeto Android nao encontrado."; exit 1; }
          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $ANDROID_DIR"

      - name: Integrar API-Football e estatisticas completas
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          android_dir = Path(os.environ['ANDROID_DIR'])
          main_activity = android_dir / 'app/src/main/java/com/matchscope/app/MainActivity.java'
          app_gradle = android_dir / 'app/build.gradle.kts'
          manifest = android_dir / 'app/src/main/AndroidManifest.xml'
          app_js = android_dir / 'app/src/main/assets/www/app.js'

          for p in (main_activity, app_gradle, app_js, manifest):
              if not p.exists():
                  raise SystemExit(f'ERRO: arquivo nao encontrado: {p}')

          # 1) Secret da API no BuildConfig.
          gradle = app_gradle.read_text(encoding='utf-8')
          if 'API_FOOTBALL_KEY' not in gradle:
              gradle += r'''

          android {
              buildFeatures {
                  buildConfig = true
              }
              defaultConfig {
                  val apiFootballKey = System.getenv("API_FOOTBALL_KEY") ?: ""
                  buildConfigField("String", "API_FOOTBALL_KEY", "\"${apiFootballKey}\"")
              }
          }
          '''
              app_gradle.write_text(gradle, encoding='utf-8')

          # 2) Internet.
          m = manifest.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in m:
              pos = m.find('>')
              if pos < 0:
                  raise SystemExit('ERRO: AndroidManifest invalido')
              m = m[:pos+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + m[pos+1:]
              manifest.write_text(m, encoding='utf-8')

          # Utilitario para localizar bloco por chaves, sem depender de indentacao.
          def brace_end(text, open_pos):
              depth = 0
              quote = None
              escape = False
              i = open_pos
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ('"', "'", '`'):
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i + 1
                  i += 1
              return -1

          # 3) MainActivity: usa chave salva no celular ou o Secret embutido no build.
          java = main_activity.read_text(encoding='utf-8')
          if 'BuildConfig.API_FOOTBALL_KEY' not in java:
              mm = re.search(r'private\s+String\s+getPreferences\s*\(\s*\)\s*\{', java)
              if not mm:
                  raise SystemExit('ERRO: metodo getPreferences() nao encontrado')
              open_pos = java.find('{', mm.start())
              end = brace_end(java, open_pos)
              if end < 0:
                  raise SystemExit('ERRO: getPreferences() incompleto')
              replacement = '''private String getPreferences() {
        String saved = getSharedPreferences(PREFS, MODE_PRIVATE).getString(API_KEY, "");
        if (saved != null && !saved.trim().isEmpty()) return saved.trim();
        String builtIn = BuildConfig.API_FOOTBALL_KEY;
        return builtIn == null ? "" : builtIn.trim();
    }'''
              java = java[:mm.start()] + replacement + java[end:]
              main_activity.write_text(java, encoding='utf-8')

          # 4) app.js: adiciona chamadas dedicadas de estatisticas/eventos/escalacoes.
          js = app_js.read_text(encoding='utf-8')

          if '/fixtures/statistics?fixture=' not in js:
              pm = re.search(r'const\s*\[\s*d\s*,\s*h\s*,\s*a\s*\]\s*=\s*await\s+Promise\.all\s*\(\s*\[', js)
              if not pm:
                  raise SystemExit('ERRO: Promise.all de loadDetail nao encontrado')

              # troca destructuring
              js = js[:pm.start()] + re.sub(
                  r'const\s*\[\s*d\s*,\s*h\s*,\s*a\s*\]',
                  'const [d,h,a,stats,events,lineups]',
                  js[pm.start():pm.end()], count=1
              ) + js[pm.end():]

              # recalcula a posicao apos a troca e encontra o fechamento da lista Promise.all
              pm2 = re.search(r'const\s*\[\s*d\s*,\s*h\s*,\s*a\s*,\s*stats\s*,\s*events\s*,\s*lineups\s*\]\s*=\s*await\s+Promise\.all\s*\(\s*\[', js)
              arr_start = pm2.end()
              close = js.find(']);', arr_start)
              if close < 0:
                  raise SystemExit('ERRO: fechamento Promise.all nao encontrado')

              before = js[:close].rstrip()
              # garante virgula antes dos novos itens
              if before and not before.endswith(','):
                  before += ','
              injected = '''
        api(`/fixtures/statistics?fixture=${encodeURIComponent(id)}`).catch(()=>({response:[]})),
        api(`/fixtures/events?fixture=${encodeURIComponent(id)}`).catch(()=>({response:[]})),
        api(`/fixtures/lineups?fixture=${encodeURIComponent(id)}`).catch(()=>({response:[]}))
      '''
              js = before + injected + js[close:]

              # Anexa os retornos ao raw antes de parseFixture(raw).
              parsed = re.search(r'const\s+parsed\s*=\s*parseFixture\s*\(\s*raw\s*\)\s*;', js)
              if not parsed:
                  raise SystemExit('ERRO: parseFixture(raw) nao encontrado')
              attach = '''raw.statistics=stats.response||raw.statistics||[];
      raw.events=events.response||raw.events||[];
      raw.lineups=lineups.response||raw.lineups||[];
      '''
              js = js[:parsed.start()] + attach + js[parsed.start():]

          # 5) Aba de estatisticas: substitui o bloco inteiro usando balanceamento de chaves.
          marker = "if(state.tab==='stats')"
          s = js.find(marker)
          if s < 0:
              marker = 'if(state.tab==="stats")'
              s = js.find(marker)
          if s < 0:
              raise SystemExit('ERRO: aba de estatisticas nao encontrada')
          open_pos = js.find('{', s)
          end = brace_end(js, open_pos)
          if end < 0:
              raise SystemExit('ERRO: bloco de estatisticas incompleto')

          new_stats = '''if(state.tab==='stats'){
      const teams=d.raw?.statistics||[];
      if(d.loaded && !teams.length)return `<section class="card" style="padding:14px"><div class="section-title">Estatísticas da partida</div><div class="divider"></div><div class="empty-copy">A API-Football não disponibilizou estatísticas detalhadas para esta partida.</div></section>`;
      const homeStats=teams[0]?.statistics||[];
      const awayStats=teams[1]?.statistics||[];
      const order=[];const seen=new Set();
      [...homeStats,...awayStats].forEach(s=>{if(s?.type&&!seen.has(s.type)){seen.add(s.type);order.push(s.type)}});
      const valueFor=(arr,type)=>{const x=arr.find(s=>s?.type===type);return x?.value===null||x?.value===undefined?'—':x.value};
      const labels={
        'Ball Possession':'Posse de bola','Total Shots':'Finalizações','Shots on Goal':'Chutes no alvo','Shots off Goal':'Chutes para fora','Blocked Shots':'Chutes bloqueados','Shots insidebox':'Chutes dentro da área','Shots outsidebox':'Chutes fora da área','Corner Kicks':'Escanteios','Offsides':'Impedimentos','Fouls':'Faltas','Yellow Cards':'Cartões amarelos','Red Cards':'Cartões vermelhos','Goalkeeper Saves':'Defesas do goleiro','Total passes':'Passes','Passes accurate':'Passes certos','Passes %':'Precisão de passes','expected_goals':'Gols esperados (xG)','Goals Prevented':'Gols evitados'
      };
      const rows=order.map(type=>statRow(labels[type]||type,valueFor(homeStats,type),valueFor(awayStats,type))).join('');
      return `<section class="card" style="padding:14px"><div class="section-title">Estatísticas da partida</div>${rows||'<div class="empty-copy">Sem estatísticas disponíveis.</div>'}</section>`;
    }'''
          js = js[:s] + new_stats + js[end:]
          app_js.write_text(js, encoding='utf-8')

          # Validacoes finais antes de compilar.
          checks = {
              'BuildConfig API key': 'BuildConfig.API_FOOTBALL_KEY' in main_activity.read_text(encoding='utf-8'),
              'Endpoint statistics': '/fixtures/statistics?fixture=' in js,
              'Endpoint events': '/fixtures/events?fixture=' in js,
              'Endpoint lineups': '/fixtures/lineups?fixture=' in js,
              'Stats dinamicas': 'const homeStats=teams[0]?.statistics||[];' in js,
          }
          for name, ok in checks.items():
              print(f'{name}: {"OK" if ok else "FALHOU"}')
              if not ok:
                  raise SystemExit(f'ERRO: validacao falhou: {name}')
          PY

          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "ERRO: API_FOOTBALL_KEY nao encontrada nos Secrets."
            exit 1
          fi
          echo "API_FOOTBALL_KEY detectada. Integracao completa habilitada."

      - name: Gerar APK V4
        run: |
          cd "$ANDROID_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK V4
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          test -n "$APK_FILE" || { echo "ERRO: APK nao encontrado."; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/resultado/MatchScope-v4.apk"
          ls -lh "$GITHUB_WORKSPACE/resultado/MatchScope-v4.apk"

      - name: Disponibilizar APK V4
        uses: actions/upload-artifact@v4
        with:
          name: MatchScope-APK-v4
          path: resultado/MatchScope-v4.apk
          if-no-files-found: error
          retention-days: 30

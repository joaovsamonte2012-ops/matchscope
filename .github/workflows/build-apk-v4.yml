name: Gerar APK MatchScope V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk-v4.yml'
      - '.github/workflows/matchscope_github_apk_ready_v3.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extrair projeto base V3
        run: |
          mkdir -p "$GITHUB_WORKSPACE/projeto"
          ZIP_FILE="$GITHUB_WORKSPACE/.github/workflows/matchscope_github_apk_ready_v3.zip"
          test -f "$ZIP_FILE" || { echo "ERRO: ZIP base V3 nao encontrado."; exit 1; }
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/projeto"

      - name: Encontrar projeto Android
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/projeto" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS_FILE" || { echo "ERRO: projeto Android nao encontrado."; exit 1; }
          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Integrar API-Football e todas as estatisticas reais
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          android_dir = Path(os.environ['ANDROID_DIR'])
          main_activity = android_dir / 'app/src/main/java/com/matchscope/app/MainActivity.java'
          app_gradle = android_dir / 'app/build.gradle.kts'
          manifest = android_dir / 'app/src/main/AndroidManifest.xml'
          app_js = android_dir / 'app/src/main/assets/www/app.js'

          for p in (main_activity, app_gradle, app_js):
              if not p.exists():
                  raise SystemExit(f'ERRO: arquivo nao encontrado: {p}')

          gradle = app_gradle.read_text()
          if 'API_FOOTBALL_KEY' not in gradle:
              gradle += r'''

          android {
              buildFeatures {
                  buildConfig = true
              }
              defaultConfig {
                  val apiFootballKey = System.getenv("API_FOOTBALL_KEY") ?: ""
                  buildConfigField("String", "API_FOOTBALL_KEY", "\"${apiFootballKey}\"")
              }
          }
          '''
              app_gradle.write_text(gradle)

          if manifest.exists():
              m = manifest.read_text()
              if 'android.permission.INTERNET' not in m:
                  pos = m.find('>')
                  if pos != -1:
                      m = m[:pos+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + m[pos+1:]
                      manifest.write_text(m)

          java = main_activity.read_text()
          old_pref = '''    private String getPreferences() {
              return getSharedPreferences(PREFS, MODE_PRIVATE).getString(API_KEY, "");
          }'''
          new_pref = '''    private String getPreferences() {
              String saved = getSharedPreferences(PREFS, MODE_PRIVATE).getString(API_KEY, "");
              if (saved != null && !saved.trim().isEmpty()) return saved.trim();
              String builtIn = BuildConfig.API_FOOTBALL_KEY;
              return builtIn == null ? "" : builtIn.trim();
          }'''
          if old_pref in java:
              java = java.replace(old_pref, new_pref, 1)
          elif 'BuildConfig.API_FOOTBALL_KEY' not in java:
              raise SystemExit('ERRO: nao foi possivel atualizar getPreferences()')
          main_activity.write_text(java)

          js = app_js.read_text()
          old_detail = '''      const [d,h,a]=await Promise.all([
              api(`/fixtures?id=${encodeURIComponent(id)}&timezone=${encodeURIComponent(tz)}`),
              api(`/fixtures?team=${encodeURIComponent(fixture.home.id)}&last=5&timezone=${encodeURIComponent(tz)}`),
              api(`/fixtures?team=${encodeURIComponent(fixture.away.id)}&last=5&timezone=${encodeURIComponent(tz)}`)
            ]);
            const raw=d.response?.[0]||fixture.raw;const parsed=parseFixture(raw);
            state.details[id]={loaded:true,fixture:parsed,raw,recentHome:h.response||[],recentAway:a.response||[]};'''
          new_detail = '''      const [d,h,a,stats,events,lineups]=await Promise.all([
              api(`/fixtures?id=${encodeURIComponent(id)}&timezone=${encodeURIComponent(tz)}`),
              api(`/fixtures?team=${encodeURIComponent(fixture.home.id)}&last=5&timezone=${encodeURIComponent(tz)}`),
              api(`/fixtures?team=${encodeURIComponent(fixture.away.id)}&last=5&timezone=${encodeURIComponent(tz)}`),
              api(`/fixtures/statistics?fixture=${encodeURIComponent(id)}`).catch(()=>({response:[]})),
              api(`/fixtures/events?fixture=${encodeURIComponent(id)}`).catch(()=>({response:[]})),
              api(`/fixtures/lineups?fixture=${encodeURIComponent(id)}`).catch(()=>({response:[]}))
            ]);
            const raw=d.response?.[0]||fixture.raw||{};
            raw.statistics=stats.response||raw.statistics||[];
            raw.events=events.response||raw.events||[];
            raw.lineups=lineups.response||raw.lineups||[];
            const parsed=parseFixture(raw);
            state.details[id]={loaded:true,fixture:parsed,raw,recentHome:h.response||[],recentAway:a.response||[],statsAvailable:(raw.statistics||[]).length>0};'''
          if old_detail in js:
              js = js.replace(old_detail, new_detail, 1)

          old_stats = '''    if(state.tab==='stats'){
              const a=analysisFor(d);return `<section class="card" style="padding:14px"><div class="section-title">Estatísticas da partida</div>${statRow('Posse',a.poss[0],a.poss[1],'%')}${statRow('Finalizações',a.shots[0],a.shots[1])}${statRow('No alvo',a.on[0],a.on[1])}${statRow('Dentro da área',a.box[0],a.box[1])}${statRow('Escanteios',a.corners[0],a.corners[1])}${statRow('Passes',a.passes[0],a.passes[1])}${statRow('Defesas',a.saves[0],a.saves[1])}</section>`;
            }'''
          old_stats_v2 = '''    if(state.tab==='stats'){
              if(d.loaded && !(d.raw?.statistics||[]).length)return `<section class="card" style="padding:14px"><div class="section-title">Estatísticas da partida</div><div class="divider"></div><div class="empty-copy">A API-Football não disponibilizou estatísticas detalhadas para esta partida. O MatchScope não substitui dados ausentes por zeros.</div></section>`;
              const a=analysisFor(d);return `<section class="card" style="padding:14px"><div class="section-title">Estatísticas da partida</div>${statRow('Posse',a.poss[0],a.poss[1],'%')}${statRow('Finalizações',a.shots[0],a.shots[1])}${statRow('No alvo',a.on[0],a.on[1])}${statRow('Dentro da área',a.box[0],a.box[1])}${statRow('Escanteios',a.corners[0],a.corners[1])}${statRow('Passes',a.passes[0],a.passes[1])}${statRow('Defesas',a.saves[0],a.saves[1])}</section>`;
            }'''
          new_stats = '''    if(state.tab==='stats'){
              const teams=d.raw?.statistics||[];
              if(d.loaded && !teams.length)return `<section class="card" style="padding:14px"><div class="section-title">Estatísticas da partida</div><div class="divider"></div><div class="empty-copy">A API-Football não disponibilizou estatísticas detalhadas para esta partida.</div></section>`;
              const homeStats=teams[0]?.statistics||[];
              const awayStats=teams[1]?.statistics||[];
              const order=[];const seen=new Set();
              [...homeStats,...awayStats].forEach(s=>{if(s?.type&&!seen.has(s.type)){seen.add(s.type);order.push(s.type)}});
              const valueFor=(arr,type)=>{const x=arr.find(s=>s?.type===type);return x?.value===null||x?.value===undefined?'—':x.value};
              const labels={
                'Ball Possession':'Posse de bola','Total Shots':'Finalizações','Shots on Goal':'Chutes no alvo','Shots off Goal':'Chutes para fora','Blocked Shots':'Chutes bloqueados','Shots insidebox':'Chutes dentro da área','Shots outsidebox':'Chutes fora da área','Corner Kicks':'Escanteios','Offsides':'Impedimentos','Fouls':'Faltas','Yellow Cards':'Cartões amarelos','Red Cards':'Cartões vermelhos','Goalkeeper Saves':'Defesas do goleiro','Total passes':'Passes','Passes accurate':'Passes certos','Passes %':'Precisão de passes','expected_goals':'Gols esperados (xG)','Goals Prevented':'Gols evitados'
              };
              const rows=order.map(type=>statRow(labels[type]||type,valueFor(homeStats,type),valueFor(awayStats,type))).join('');
              return `<section class="card" style="padding:14px"><div class="section-title">Estatísticas da partida</div>${rows||'<div class="empty-copy">Sem estatísticas disponíveis.</div>'}</section>`;
            }'''
          if old_stats_v2 in js:
              js = js.replace(old_stats_v2, new_stats, 1)
          elif old_stats in js:
              js = js.replace(old_stats, new_stats, 1)
          elif "const teams=d.raw?.statistics||[];" not in js:
              raise SystemExit('ERRO: bloco de estatisticas nao encontrado no app.js')

          app_js.write_text(js)
          PY

          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "ERRO: API_FOOTBALL_KEY nao encontrada nos Secrets."
            exit 1
          else
            echo "API_FOOTBALL_KEY detectada. Todas as estatisticas disponiveis serao exibidas."
          fi

      - name: Gerar APK V4
        run: |
          cd "$ANDROID_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK V4
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          test -n "$APK_FILE" || { echo "ERRO: APK nao encontrado."; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/resultado/MatchScope-v4.apk"
          ls -lh "$GITHUB_WORKSPACE/resultado/MatchScope-v4.apk"

      - name: Disponibilizar APK V4
        uses: actions/upload-artifact@v4
        with:
          name: MatchScope-APK-v4
          path: resultado/MatchScope-v4.apk
          if-no-files-found: error
          retention-days: 30

name: Gerar APK MatchScore Beta 27

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-apk-v27.yml'
      - '.github/scripts/patch_beta_v27_professional.py'
      - '.github/assets/matchscore-rpg-hero.jpg'
      - '.github/assets/matchscore-rpg-catalog.jpg'
      - '.github/assets/matchscore-rpg-progression.jpg'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      MATCHSCORE_KEYSTORE_B64: ${{ secrets.MATCHSCORE_KEYSTORE_B64 }}
      MATCHSCORE_KEYSTORE_PASSWORD: ${{ secrets.MATCHSCORE_KEYSTORE_PASSWORD }}
      MATCHSCORE_KEY_ALIAS: ${{ secrets.MATCHSCORE_KEY_ALIAS }}
      MATCHSCORE_KEY_PASSWORD: ${{ secrets.MATCHSCORE_KEY_PASSWORD }}
      MATCHSCORE_API_BASE_URL: https://matchscope-kjf9.onrender.com

    steps:
      - uses: actions/checkout@v4

      - name: Validar backend antes do build
        run: |
          echo "Testando $MATCHSCORE_API_BASE_URL/health"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$MATCHSCORE_API_BASE_URL/health" | tee /tmp/health.json
          grep -q '"ok"' /tmp/health.json

      - name: Preparar bundles
        run: |
          rm -rf "$GITHUB_WORKSPACE/.v23" "$GITHUB_WORKSPACE/.v24"
          mkdir -p "$GITHUB_WORKSPACE/.v23" "$GITHUB_WORKSPACE/.v24"
          unzip -q "$GITHUB_WORKSPACE/.github/assets/v23-texts.zip" -d "$GITHUB_WORKSPACE/.v23"
          base64 -d "$GITHUB_WORKSPACE/.github/assets/v24-bundle.txt" > "$RUNNER_TEMP/v24.zip"
          unzip -q "$RUNNER_TEMP/v24.zip" -d "$GITHUB_WORKSPACE/.v24"

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}

      - name: Extrair projeto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/projeto"
          unzip -q "$GITHUB_WORKSPACE/.github/workflows/matchscope_github_apk_ready_v3.zip" -d "$GITHUB_WORKSPACE/projeto"
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/projeto" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS_FILE"
          echo "ANDROID_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Validar assinatura
        run: |
          test -n "$MATCHSCORE_KEYSTORE_B64"
          echo "$MATCHSCORE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchscore-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/matchscore-release.jks" -alias "$MATCHSCORE_KEY_ALIAS" -storepass "$MATCHSCORE_KEYSTORE_PASSWORD" >/dev/null

      - name: Patches base
        run: |
          python3 .github/scripts/patch_v4.py
          python3 .github/scripts/prepare_lineup_patch_v6.py
          python3 .github/scripts/patch_lineup_pitch.py
          python3 .github/scripts/patch_beta_branding.py
          python3 .github/scripts/patch_beta_social.py
          python3 .github/scripts/patch_beta_progression.py
          python3 .github/scripts/patch_beta_auth_payments.py
          python3 .github/scripts/patch_native_google_auth.py
          python3 .github/scripts/patch_native_google_auth_js.py
          python3 .github/scripts/patch_beta_profile_menu.py
          python3 .github/scripts/patch_beta_character_gender.py
          python3 .github/scripts/patch_beta_cosmetics.py
          python3 .github/scripts/patch_beta_rpg_daily.py
          python3 .github/scripts/patch_beta_hotfix.py
          V23_BUNDLE_DIR="$GITHUB_WORKSPACE/.v23" python3 "$GITHUB_WORKSPACE/.v23/patch_beta_rpg_v23.py"
          V24_BUNDLE_DIR="$GITHUB_WORKSPACE/.v24" python3 "$GITHUB_WORKSPACE/.v24/patch_beta_v24.py"
          python3 .github/scripts/patch_beta_v27_professional.py

      - name: Validar assets da Beta 27
        run: |
          WWW="$ANDROID_DIR/app/src/main/assets/www"
          test -s "$WWW/rpg-hero-v27.jpg"
          test -s "$WWW/rpg-catalog-v27.jpg"
          test -s "$WWW/rpg-progression-v27.jpg"
          test -s "$WWW/beta-v27.css"
          test -s "$WWW/beta-v27.js"
          grep -q 'BETA 27' "$WWW/beta-v27.js"
          grep -q 'rpg-hero-v27.jpg' "$WWW/beta-v27.css"

      - name: Gerar APK
        run: cd "$ANDROID_DIR" && gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validar conteúdo do APK
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          test -n "$APK_FILE"
          unzip -l "$APK_FILE" | grep -q 'assets/www/rpg-hero-v27.jpg'
          unzip -l "$APK_FILE" | grep -q 'assets/www/rpg-catalog-v27.jpg'
          unzip -p "$APK_FILE" assets/www/index.html | grep -q 'beta-v27.js?v=27'
          unzip -p "$APK_FILE" assets/www/beta-v27.js | grep -q 'Dados de futebol'

      - name: Assinar APK
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/matchscore-release.jks" --ks-key-alias "$MATCHSCORE_KEY_ALIAS" --ks-pass "pass:$MATCHSCORE_KEYSTORE_PASSWORD" --key-pass "pass:$MATCHSCORE_KEY_PASSWORD" --out "$GITHUB_WORKSPACE/resultado/MatchScore-Beta27.apk" "$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/resultado/MatchScore-Beta27.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MatchScore-APK-Beta27
          path: resultado/MatchScore-Beta27.apk
          if-no-files-found: error
          retention-days: 30

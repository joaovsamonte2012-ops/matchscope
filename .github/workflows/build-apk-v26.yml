name: Gerar APK MatchScore Beta 26

on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths:
      - '.github/workflows/build-apk-v26.yml'
      - '.github/scripts/patch_beta_v26_rpg_rebuild.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      MATCHSCORE_KEYSTORE_B64: ${{ secrets.MATCHSCORE_KEYSTORE_B64 }}
      MATCHSCORE_KEYSTORE_PASSWORD: ${{ secrets.MATCHSCORE_KEYSTORE_PASSWORD }}
      MATCHSCORE_KEY_ALIAS: ${{ secrets.MATCHSCORE_KEY_ALIAS }}
      MATCHSCORE_KEY_PASSWORD: ${{ secrets.MATCHSCORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar bundles
        run: |
          rm -rf "$GITHUB_WORKSPACE/.v23" "$GITHUB_WORKSPACE/.v24"
          mkdir -p "$GITHUB_WORKSPACE/.v23" "$GITHUB_WORKSPACE/.v24"
          unzip -q "$GITHUB_WORKSPACE/.github/assets/v23-texts.zip" -d "$GITHUB_WORKSPACE/.v23"
          base64 -d "$GITHUB_WORKSPACE/.github/assets/v24-bundle.txt" > "$RUNNER_TEMP/v24.zip"
          unzip -q "$RUNNER_TEMP/v24.zip" -d "$GITHUB_WORKSPACE/.v24"
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Extrair projeto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/projeto"
          unzip -q "$GITHUB_WORKSPACE/.github/workflows/matchscope_github_apk_ready_v3.zip" -d "$GITHUB_WORKSPACE/projeto"
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/projeto" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS_FILE"
          echo "ANDROID_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
      - name: Validar assinatura
        run: |
          test -n "$MATCHSCORE_KEYSTORE_B64"
          echo "$MATCHSCORE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchscore-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/matchscore-release.jks" -alias "$MATCHSCORE_KEY_ALIAS" -storepass "$MATCHSCORE_KEYSTORE_PASSWORD" >/dev/null
      - name: Patches base
        run: |
          python3 .github/scripts/patch_v4.py
          python3 .github/scripts/prepare_lineup_patch_v6.py
          python3 .github/scripts/patch_lineup_pitch.py
          python3 .github/scripts/patch_beta_branding.py
          python3 .github/scripts/patch_beta_social.py
          python3 .github/scripts/patch_beta_progression.py
          python3 .github/scripts/patch_beta_auth_payments.py
          python3 .github/scripts/patch_native_google_auth.py
          python3 .github/scripts/patch_native_google_auth_js.py
          python3 .github/scripts/patch_beta_profile_menu.py
          python3 .github/scripts/patch_beta_character_gender.py
          python3 .github/scripts/patch_beta_cosmetics.py
          python3 .github/scripts/patch_beta_rpg_daily.py
          python3 .github/scripts/patch_beta_hotfix.py
          V23_BUNDLE_DIR="$GITHUB_WORKSPACE/.v23" python3 "$GITHUB_WORKSPACE/.v23/patch_beta_rpg_v23.py"
          V24_BUNDLE_DIR="$GITHUB_WORKSPACE/.v24" python3 "$GITHUB_WORKSPACE/.v24/patch_beta_v24.py"
          python3 .github/scripts/patch_beta_v26_rpg_rebuild.py
      - name: Gerar APK
        run: cd "$ANDROID_DIR" && gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validar Beta 26
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          test -n "$APK_FILE"
          unzip -p "$APK_FILE" assets/www/index.html | grep -q 'beta-v26.js?v=26'
          unzip -p "$APK_FILE" assets/www/beta-v26.js | grep -q 'msRpg26'
          unzip -p "$APK_FILE" assets/www/beta-v26.js | grep -q 'Inventário RPG'
          unzip -p "$APK_FILE" assets/www/beta-v26.js | grep -q 'BETA 26'
          unzip -p "$APK_FILE" assets/www/beta-v26.css | grep -q '.r26-grid'
          echo 'Beta 26 validada: nova tela RPG, inventario em grade e equipamentos visuais presentes.'
      - name: Assinar APK
        run: |
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/matchscore-release.jks" --ks-key-alias "$MATCHSCORE_KEY_ALIAS" --ks-pass "pass:$MATCHSCORE_KEYSTORE_PASSWORD" --key-pass "pass:$MATCHSCORE_KEY_PASSWORD" --out "$GITHUB_WORKSPACE/resultado/MatchScore-Beta26.apk" "$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/resultado/MatchScore-Beta26.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MatchScore-APK-Beta26
          path: resultado/MatchScore-Beta26.apk
          if-no-files-found: error
          retention-days: 30

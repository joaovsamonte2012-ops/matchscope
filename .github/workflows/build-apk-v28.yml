name: Gerar APK MatchScore V28 Rebuild

on:
  workflow_dispatch:
  push:
    branches: [rebuild-v28]
    paths:
      - '.github/workflows/build-apk-v28.yml'
      - '.github/scripts/patch_v28_rebuild.py'
      - '.github/scripts/patch_v28_api_football.py'
      - '.github/scripts/patch_v28_touch_hotfix.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      MATCHSCORE_KEYSTORE_B64: ${{ secrets.MATCHSCORE_KEYSTORE_B64 }}
      MATCHSCORE_KEYSTORE_PASSWORD: ${{ secrets.MATCHSCORE_KEYSTORE_PASSWORD }}
      MATCHSCORE_KEY_ALIAS: ${{ secrets.MATCHSCORE_KEY_ALIAS }}
      MATCHSCORE_KEY_PASSWORD: ${{ secrets.MATCHSCORE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Validar API-Football
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY" || { echo "ERRO: API_FOOTBALL_KEY vazia"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 4 \
            -H "x-apisports-key: $API_FOOTBALL_KEY" \
            -H "Accept: application/json" \
            "https://v3.football.api-sports.io/status" -o /tmp/api-football-status.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/api-football-status.json'))
          assert isinstance(j.get('response'), dict), j
          assert not j.get('errors'), j
          print('API-Football autenticada com sucesso.')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extrair projeto base
        run: |
          rm -rf "$GITHUB_WORKSPACE/projeto"
          mkdir -p "$GITHUB_WORKSPACE/projeto"
          unzip -q "$GITHUB_WORKSPACE/.github/workflows/matchscope_github_apk_ready_v3.zip" -d "$GITHUB_WORKSPACE/projeto"
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/projeto" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS_FILE"
          echo "ANDROID_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"

      - name: Aplicar V28 funcional
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v4.py
          python3 .github/scripts/prepare_lineup_patch_v6.py
          python3 .github/scripts/patch_lineup_pitch.py
          python3 .github/scripts/patch_beta_branding.py
          python3 .github/scripts/patch_beta_auth_payments.py
          python3 .github/scripts/patch_native_google_auth.py
          python3 .github/scripts/patch_native_google_auth_js.py
          python3 .github/scripts/patch_beta_profile_menu.py
          python3 .github/scripts/patch_v28_rebuild.py
          python3 .github/scripts/patch_v28_api_football.py
          python3 .github/scripts/patch_v28_touch_hotfix.py

      - name: Validar V28 antes de compilar
        run: |
          set -euo pipefail
          WWW="$ANDROID_DIR/app/src/main/assets/www"
          test -s "$WWW/v28.css"
          test -s "$WWW/v28.js"
          test -s "$WWW/v28-player-0.svg"
          test -s "$WWW/v28-player-1.svg"
          test -s "$WWW/v28-player-2.svg"
          test -s "$WWW/v28-player-3.svg"
          node --check "$WWW/v28.js"
          grep -q 'MatchScoreV28Api.fixturesByDate' "$WWW/v28.js"
          grep -q 'API-Football OK' "$WWW/v28.js"
          grep -q "closest('\[data-tab\]')" "$WWW/v28.js"
          grep -Fq 'data-fixture-index="${i}"' "$WWW/v28.js"
          grep -q 'openMatch(Number' "$WWW/v28.js"
          grep -q 'touch-action:manipulation' "$WWW/v28.css"
          grep -q 'v28.js?v=28' "$WWW/index.html"
          ! grep -q 'matchscope-kjf9.onrender.com' "$WWW/v28.js"
          ! grep -q 'Sportmonks' "$WWW/v28.js"
          BRIDGE=$(find "$ANDROID_DIR/app/src/main" -name 'MatchScoreV28Api.java' -print -quit)
          test -s "$BRIDGE"
          grep -q 'v3.football.api-sports.io/fixtures' "$BRIDGE"
          grep -q 'BuildConfig.API_FOOTBALL_KEY' "$BRIDGE"

      - name: Compilar APK
        run: cd "$ANDROID_DIR" && gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validar APK
        run: |
          set -euo pipefail
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          test -n "$APK_FILE"
          unzip -l "$APK_FILE" | grep -q 'assets/www/v28.js'
          unzip -p "$APK_FILE" assets/www/v28.js > /tmp/v28-built.js
          unzip -p "$APK_FILE" assets/www/v28.css > /tmp/v28-built.css
          node --check /tmp/v28-built.js
          grep -q "closest('\[data-tab\]')" /tmp/v28-built.js
          grep -Fq 'data-fixture-index="${i}"' /tmp/v28-built.js
          grep -q 'touch-action:manipulation' /tmp/v28-built.css
          echo "APK_SIZE=$(stat -c%s "$APK_FILE")" >> "$GITHUB_ENV"
          echo "APK bruto: $(stat -c%s "$APK_FILE") bytes"

      - name: Assinar APK
        run: |
          set -euo pipefail
          test -n "$MATCHSCORE_KEYSTORE_B64"
          echo "$MATCHSCORE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/matchscore-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/matchscore-release.jks" -alias "$MATCHSCORE_KEY_ALIAS" -storepass "$MATCHSCORE_KEYSTORE_PASSWORD" >/dev/null
          APK_FILE=$(find "$ANDROID_DIR" -type f -name "app-debug.apk" -print -quit)
          mkdir -p "$GITHUB_WORKSPACE/resultado"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/matchscore-release.jks" --ks-key-alias "$MATCHSCORE_KEY_ALIAS" --ks-pass "pass:$MATCHSCORE_KEYSTORE_PASSWORD" --key-pass "pass:$MATCHSCORE_KEY_PASSWORD" --out "$GITHUB_WORKSPACE/resultado/MatchScore-V28-TouchFix.apk" "$APK_FILE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/resultado/MatchScore-V28-TouchFix.apk"
          stat -c 'APK final: %s bytes' "$GITHUB_WORKSPACE/resultado/MatchScore-V28-TouchFix.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MatchScore-APK-V28-TouchFix
          path: resultado/MatchScore-V28-TouchFix.apk
          if-no-files-found: error
          retention-days: 30

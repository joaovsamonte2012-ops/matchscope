name: Gerar APK MatchScope

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extrair projeto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/projeto"

          ZIP_FILE="$GITHUB_WORKSPACE/matchscope_github_apk_ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERRO: ZIP do MatchScope nao encontrado."
            echo "Arquivos existentes no repositorio:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/projeto"

          echo "Projeto extraido com sucesso."
          echo "Arquivos encontrados:"
          find "$GITHUB_WORKSPACE/projeto" -maxdepth 5 -type f | sort | head -150

      - name: Encontrar projeto Android
        run: |
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts nao encontrado."
            echo "Arquivos Gradle encontrados:"
            find "$GITHUB_WORKSPACE/projeto" \
              -type f \
              \( -name "*.gradle" -o -name "*.gradle.kts" \) \
              -print
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android encontrado em:"
          echo "$ANDROID_DIR"

          echo "Arquivo de configuracao encontrado:"
          echo "$SETTINGS_FILE"

      - name: Verificar projeto Android
        run: |
          echo "Diretorio Android:"
          echo "$ANDROID_DIR"

          echo "Conteudo:"
          ls -la "$ANDROID_DIR"

          if [ ! -f "$ANDROID_DIR/settings.gradle" ] && [ ! -f "$ANDROID_DIR/settings.gradle.kts" ]; then
            echo "ERRO: settings.gradle/settings.gradle.kts nao encontrado."
            exit 1
          fi

          if [ ! -d "$ANDROID_DIR/app" ]; then
            echo "ERRO: pasta app nao encontrada."
            exit 1
          fi

          echo "Projeto Android verificado com sucesso."

      - name: Mostrar configuracao Android
        run: |
          echo "Arquivos principais:"
          find "$ANDROID_DIR" \
            -maxdepth 3 \
            -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "AndroidManifest.xml" \) \
            -print

      - name: Gerar APK
        run: |
          cd "$ANDROID_DIR"

          echo "Iniciando compilacao do MatchScope..."

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Localizar APK
        run: |
          APK_FILE=$(find "$ANDROID_DIR" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERRO: app-debug.apk nao encontrado."

            echo "Outros APKs encontrados:"
            find "$ANDROID_DIR" -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

          echo "APK encontrado:"
          echo "$APK_FILE"

          echo "Tamanho:"
          ls -lh "$APK_FILE"

      - name: Preparar APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resultado"

          cp \
            "$APK_FILE" \
            "$GITHUB_WORKSPACE/resultado/MatchScope.apk"

          echo "APK final:"
          ls -lh "$GITHUB_WORKSPACE/resultado/MatchScope.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MatchScope-APK
          path: resultado/MatchScope.apk
          if-no-files-found: error
          retention-days: 30
